name: Deal Aggregator

on:
  schedule:
    # har 15 min — 2880 min/month, free tier 2000 min
    # safe: 30 min use karo
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: deals
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install curl_cffi beautifulsoup4 lxml

      - name: Run bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python bot.py

      - name: Save state
        run: |
          git config user.name "deal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json keywords.json || true
          git diff --staged --quiet || git commit -m "state $(date -u +%Y-%m-%dT%H:%M)"
          git push || true
